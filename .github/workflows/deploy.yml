name: Deploy to GitHub Pages

# 站点是纯静态导出（next.config.ts 里 output: 'export'），
# 所以这里只做两件事：在 CI 里构建 nextjs/，然后把 nextjs/out 发布到 Pages。
# 用 Actions 发布不经过 Jekyll，_next/ 不会被吞掉（本地构建推分支则需要 .nojekyll）。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个发布，新的 push 取消旧的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nextjs/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 构建静态站
        run: npm run build
        env:
          # sitemap / RSS / canonical 的绝对地址。换域名时改这里或 site.ts 的默认值。
          NEXT_PUBLIC_SITE_URL: https://canyon-li.github.io

      - name: 自检（内容与链接）
        run: npm run verify

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          # 注意：uses 的 path 相对仓库根，不受上面 defaults.run.working-directory 影响
          path: nextjs/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
